spring.application.name=tienda-api
server.address=127.0.0.1

spring.datasource.url=jdbc:mysql://localhost:3306/tienda_db
spring.datasource.username=tienda
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Sesion del login: cookie HttpOnly, solo del mismo sitio, 8 horas de inactividad
server.servlet.session.timeout=8h
server.servlet.session.cookie.same-site=strict