<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tienda</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f4fa3'/%3E%3Cpath d='M6 13l2-6h16l2 6v1a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0zM8 18v7h16v-7' fill='%23f2a900'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="cargando">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-store" viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9M3 9v1a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0V9M5 13v8h14v-8M10 21v-5h4v5"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 12.4a1 1 0 0 0 1 .8h8.8a1 1 0 0 0 1-.8L20 7H6"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3.2-5.5 6.5-5.5s6 2 6.5 5.5M16 4.7a3.5 3.5 0 0 1 0 6.6M18 14.8c2 .6 3.2 2.3 3.5 5.2"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 7v5h5"/><path d="M3.5 12A9 9 0 1 1 6 18.4"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-scan" viewBox="0 0 24 24"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M8 8v8M12 8v8M16 8v8"/></symbol>
    <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></symbol>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c0-1 1-1.5 2.5-1.5s2.5.7 2.5 1.8-1 1.5-2.5 1.8-2.5.8-2.5 1.9S10.5 16 12 16s2.5-.6 2.5-1.5"/></symbol>
</defs></svg>

<div id="login">
    <div class="hero" aria-hidden="true">
        <svg viewBox="0 0 320 260"><rect x="30" y="100" width="260" height="140" rx="6" fill="#fff" opacity=".95"/>
            <path d="M20 100l18-62h244l18 62z" fill="#f2a900"/>
            <g fill="#fff"><path d="M56 38h26l-6 62H50zM108 38h26l-2 62h-26zM160 38h26l2 62h-26zM212 38h26l6 62h-26z" opacity=".9"/></g>
            <path d="M20 100a30 22 0 0 0 60 0 30 22 0 0 0 60 0 30 22 0 0 0 60 0 30 22 0 0 0 60 0 30 22 0 0 0 60 0z" fill="#d98e00"/>
            <rect x="62" y="136" width="70" height="52" rx="4" fill="#dbe6fb"/><rect x="190" y="136" width="70" height="104" rx="4" fill="#1f4fa3"/><circle cx="250" cy="190" r="4" fill="#f2a900"/>
            <rect x="66" y="196" width="26" height="22" rx="3" fill="#c8372d"/><rect x="96" y="204" width="30" height="14" rx="3" fill="#2e7d5b"/><circle cx="79" cy="190" r="8" fill="#f2a900"/>
            <rect x="30" y="238" width="260" height="6" rx="3" fill="#173b7d" opacity=".25"/></svg>
        <h2>Todo en su lugar,<br>cada peso en su cuenta.</h2>
    </div>
    <form id="loginForm">
        <h1><svg class="i"><use href="#i-store"/></svg>Tienda</h1>
        <p class="sub">Inicia sesión para abrir la caja.</p>
        <label>Usuario<input name="username" autocomplete="username" required></label>
        <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
        <p id="loginError" role="alert"></p>
        <button class="primario">Entrar</button>
    </form>
</div>

<aside>
    <h1><svg class="i"><use href="#i-store"/></svg>Tienda</h1>
    <nav>
        <button data-v="venta" class="on"><svg class="i"><use href="#i-cart"/></svg>Vender</button>
        <button data-v="productos"><svg class="i"><use href="#i-box"/></svg>Productos</button>
        <button data-v="clientes"><svg class="i"><use href="#i-users"/></svg>Clientes</button>
        <button data-v="reportes"><svg class="i"><use href="#i-chart"/></svg>Reportes</button>
    </nav>
    <div class="cuenta"><small id="usuario"></small>
        <button id="cambiarPass"><svg class="i"><use href="#i-key"/></svg>Cambiar contraseña</button>
        <button id="salir"><svg class="i"><use href="#i-out"/></svg>Salir</button></div>
</aside>

<main>
    <section id="venta">
        <div class="col">
            <div class="busca"><svg class="i"><use href="#i-scan"/></svg><input id="buscar" placeholder="Escanea el código de barras o escribe el nombre y presiona Enter" autofocus></div>
            <div id="resultados" class="lista"></div>
        </div>
        <div class="ticket">
            <h2><svg class="i"><use href="#i-receipt"/></svg>Venta actual</h2>
            <div id="carrito"></div>
            <div class="total"><span>Total</span><strong id="total">$0.00</strong></div>
            <div class="tipo">
                <label><input type="radio" name="tipo" value="CONTADO" checked> Contado</label>
                <label><input type="radio" name="tipo" value="CREDITO"> Crédito (fiado)</label>
            </div>
            <label>Cliente <select id="cliente"></select></label>
            <label id="lmetodo">Pago con <select id="metodo"><option value="EFECTIVO">Efectivo</option><option value="TRANSFERENCIA">Transferencia</option></select></label>
            <div id="abonoBox" hidden>
                <label>Abono inicial (opcional) <input id="abono" type="number" min="0" step="0.01"></label>
                <label>Abono con <select id="metodoAbono"><option value="EFECTIVO">Efectivo</option><option value="TRANSFERENCIA">Transferencia</option></select></label>
            </div>
            <button id="cobrar" class="primario" disabled><svg class="i"><use href="#i-coin"/></svg>Cobrar</button>
            <button id="vaciar" class="sec">Vaciar</button>
        </div>
    </section>

    <section id="productos" hidden>
        <header><div class="busca"><svg class="i"><use href="#i-search"/></svg><input id="qProd" placeholder="Buscar producto"></div>
            <div class="seg" id="segProd"><button data-i="0" class="on">Activos</button><button data-i="1">Desactivados</button></div>
            <button class="primario" id="nuevoProd"><svg class="i"><use href="#i-plus"/></svg>Nuevo producto</button></header>
        <table><thead><tr><th>Nombre</th><th>Código</th><th class="n">Precio</th><th></th></tr></thead><tbody id="tProd"></tbody></table>
    </section>

    <section id="clientes" hidden>
        <header><div class="busca"><svg class="i"><use href="#i-search"/></svg><input id="qCli" placeholder="Buscar cliente"></div>
            <div class="seg" id="segCli"><button data-i="0" class="on">Activos</button><button data-i="1">Desactivados</button></div>
            <button class="primario" id="nuevoCli"><svg class="i"><use href="#i-plus"/></svg>Nuevo cliente</button></header>
        <table><thead><tr><th>Nombre</th><th class="n">Debe</th><th></th></tr></thead><tbody id="tCli"></tbody></table>
    </section>

    <section id="reportes" hidden>
        <header>
            <label>Del <input type="date" id="desde"></label><label>al <input type="date" id="hasta"></label>
            <button class="primario" id="verReporte">Ver reportes</button>
        </header>
        <div id="rCorte" class="cards"></div>
        <h2>Productos más vendidos</h2>
        <table><thead><tr><th>Producto</th><th class="n">Cantidad</th><th class="n">Ingresos</th></tr></thead><tbody id="rTop"></tbody></table>
        <h2>Cuentas por cobrar</h2>
        <div id="rCxc"></div>
    </section>
</main>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script src="js/app.js"></script>
</body>
</html>
